name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked development dependencies (runtime stays dependency-free)
        run: npm ci
      - name: Assert LF line endings in sources
        shell: bash
        run: |
          if grep -rlP '\r' src/ scripts/ ai/ exe/ tests/ 2>/dev/null; then
            echo "::error::CR line endings found (see .gitattributes)"
            exit 1
          fi
      - name: Full test suite and standalone HTML sync guard
        run: npm test
      - name: Rebuild CLI and test HTTP bridge and MCP
        run: npm run test:bridge
      - name: Install Chromium
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Headless browser regression tests
        if: runner.os == 'Linux'
        run: npm run test:browser
      - name: Build Windows executable and smoke-test SEA argument dispatch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/exe-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
