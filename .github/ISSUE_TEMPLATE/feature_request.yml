name: 💡 Feature request（功能建议）
description: Propose an improvement. 中文/English both welcome.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation（要解决的问题）
      description: What PCB design or AI-workflow pain does this address? Include your board scenario (layers / pad count / density).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution（建议方案）
      description: Desired behavior, CLI/GUI shape, and any reference implementation (KiCad/Altium/Freerouting behavior you want mirrored).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered（考虑过的替代方案）
